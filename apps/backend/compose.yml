services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: expense_tracker_java
      POSTGRES_USER: expense_tracker
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set SPRING_DATASOURCE_PASSWORD before starting PostgreSQL}
    ports:
      - "127.0.0.1:${BACKEND_POSTGRES_PORT:-5433}:5432"
    volumes:
      - backend-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense_tracker -d expense_tracker_java"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  backend-postgres:
